<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Review</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.brown.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.cburnett.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header class="brand">
      <h1>Game Review <a href="tree.html" class="navlink">Opening tree &rarr;</a></h1>
      <p id="summary" class="muted"></p>
    </header>
    <nav class="tabs">
      <button class="tab active" data-tab="highlights">Highlights</button>
      <button class="tab" data-tab="browse">All games</button>
    </nav>
    <section id="tab-highlights" class="tab-body"></section>
    <section id="tab-browse" class="tab-body hidden">
      <div class="filters">
        <input id="f-q" type="search" placeholder="Opponent, opening, ECO, game id">
        <div class="row">
          <select id="f-result"><option value="">Any result</option><option>win</option><option>loss</option><option>draw</option></select>
          <select id="f-speed"><option value="">Any speed</option><option>bullet</option><option>blitz</option><option>rapid</option><option>classical</option><option>correspondence</option></select>
          <select id="f-color"><option value="">Any color</option><option>white</option><option>black</option></select>
        </div>
        <select id="f-sort">
          <option value="date">Newest first</option>
          <option value="gap">Largest rating gap</option>
          <option value="opp">Strongest opponent</option>
          <option value="length">Longest</option>
          <option value="accuracy">Highest accuracy</option>
          <option value="comeback">Biggest comeback</option>
        </select>
      </div>
      <p id="browse-count" class="muted"></p>
      <ul id="browse-list" class="game-list"></ul>
      <button id="browse-more" class="ghost hidden">Load more</button>
    </section>
  </aside>

  <main class="board-area">
    <div class="player top" id="player-top"></div>
    <div class="board-row">
      <div class="evalbar" id="evalbar"><div class="evalbar-fill" id="evalbar-fill"></div><span id="evalbar-label"></span></div>
      <div class="board-wrap"><div id="board"></div></div>
    </div>
    <div class="player bottom" id="player-bottom"></div>
    <div class="controls">
      <button data-nav="start" title="Start (Home)">&#x23EE;</button>
      <button data-nav="prev" title="Back (&larr;)">&#x25C0;</button>
      <button data-nav="next" title="Forward (&rarr;)">&#x25B6;</button>
      <button data-nav="end" title="End (End)">&#x23ED;</button>
      <button data-nav="flip" title="Flip (f)">&#x21C5;</button>
      <button data-nav="key" title="Jump to key moment (k)">&#x2605;</button>
    </div>
    <div id="variation-bar" class="variation-bar hidden">
      Exploring: <span id="variation-moves"></span>
      <button id="variation-exit" class="ghost">Back to game</button>
    </div>
  </main>

  <section class="panel">
    <div id="game-info" class="game-info"><p class="muted">Pick a game from the left.</p></div>
    <div id="graph" class="graph"></div>
    <div class="engine">
      <label class="toggle"><input type="checkbox" id="engine-on"> Live Stockfish</label>
      <div id="engine-lines" class="engine-lines"></div>
    </div>
    <div id="moves" class="moves"></div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
